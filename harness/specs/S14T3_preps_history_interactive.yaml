id: S14T3
title: "PrepsPage: 이력 탭 인터랙티브 + multiSelect 검색/선택취소 + 칼로리"
category: ui
status: implemented

description: |
  보충이력 탭 (issues 4, 6, 8):
    - 기존 읽기전용 List(date — user_email 텍스트) 제거
    - DatePicker로 날짜 추가 → addRestockRecord + upsertPrep(날짜 합집합)
    - 기존 이력: closable Tag → × 클릭 시 deleteRestockRecord + upsertPrep(날짜 제거)

  multiSelect 모달 (issues 3, 6):
    - 모달 상단 Input.Search 추가 → 프렙 이름 필터
    - disabled={already} 제거 → 이미 보충된 항목도 체크 해제 가능
    - onOk: toAdd(추가) + toRemove(해제) 양방향 처리

  기본정보 탭 (issue 5):
    - 폼 요약줄에 kcal > 0이면 · Nkcal 표시

  deleteRestockRecord import 추가 (기존 미import 상태 수정).

implementation_targets:
  - src/pages/PrepsPage.tsx

acceptance_criteria:
  - npm run build 성공
  - PrepsPage.tsx에 deleteRestockRecord import 존재
  - 이력 탭에 DatePicker 렌더 코드 존재
  - multiSelect 모달에 Input.Search 존재
  - multiSelect 체크박스에 disabled={already} 없음
  - onOk에 toRemove 및 deleteRestockRecord 호출 존재
  - 기본정보 탭 요약줄에 kcal 표시 코드 존재

test_command: "npm run build"
