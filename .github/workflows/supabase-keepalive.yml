name: Supabase Keepalive

# Supabase 무료 플랜은 7일간 API 요청이 없으면 프로젝트가 자동 일시정지됨.
# 하루 1번 가벼운 핑을 보내 활성 상태를 유지한다 (실패 1~2회가 있어도 7일 내 여유 확보).
on:
  schedule:
    - cron: '0 3 * * *' # 매일 UTC 03:00 (KST 12:00)
  workflow_dispatch: {} # 수동 실행 버튼

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL 또는 SUPABASE_ANON_KEY 시크릿이 설정되지 않았습니다." >&2
            exit 1
          fi

          # 루트(/rest/v1/)는 게이트웨이 단계에서 바로 401을 반환하며 DB까지 도달하지
          # 않아 Supabase의 비활성 감지(auto-pause) 카운터가 리셋되지 않는다.
          # 실제 테이블을 조회해야 DB 활동으로 집계된다.
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/shift_types?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "Supabase REST endpoint responded with status: $status"

          if [ "$status" -ge 200 ] && [ "$status" -lt 500 ]; then
            echo "Keepalive ping 성공 (프로젝트 활성 상태 확인됨)"
          else
            echo "Keepalive ping 실패" >&2
            exit 1
          fi
